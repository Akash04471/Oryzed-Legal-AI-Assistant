[project]
name = "oryzed-legal-ai"
version = "0.1.0"
description = "Oryzed Legal AI Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "gunicorn",
    "python-dotenv",
    "agno",
    "google-genai",
    "google-generativeai",
    "groq",
    "duckduckgo-search",
    "ddgs",
    "requests",
    "beautifulsoup4",
    "flask-cors",
    "typing-extensions",
    "psycopg2-binary",
    "PyPDF2",
    "python-docx",
    "Pillow",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "qdrant-client",
    "openai",
    "tiktoken"
]

[tool.vercel]
entrypoint = "api/index.py"
