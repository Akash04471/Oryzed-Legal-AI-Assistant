<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | ORYZED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}" />
</head>

<body>
    <div class="auth-stage">
        <main class="auth-shell" role="main">
            <div class="brand">
                <img src="{{ url_for('static', filename='Oryzed_Logo.png') }}" alt="Oryzed Logo" class="brand-logo" />
            </div>

            <div class="auth-tagline">Account Recovery</div>
            <h1 class="auth-title">Reset <span class="accent">Password</span></h1>
            <p class="auth-subtitle">Enter your account email. We'll send a 6-digit code so you can set a new password.</p>

            <div id="auth-error-box" class="auth-error" style="display: none;" role="alert"></div>

            <form id="forgot-password-form" class="auth-form" autocomplete="off">
                <div id="email-stage">
                    <label class="auth-label" for="email">Email</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" id="email" name="email" type="email" placeholder="Enter your account email" required />
                    </div>
                    <button class="auth-btn" type="submit" id="send-reset-btn">Send Reset Code</button>
                </div>

                <div id="reset-stage" style="display: none;">
                    <div class="auth-tagline" style="margin-bottom: 0.5rem;">Verification Required</div>
                    <p class="auth-subtitle" style="margin-top: 0; font-size: 0.85rem;">Enter the code we sent you, then choose a new password.</p>

                    <label class="auth-label" for="otp">Verification Code</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" id="otp" name="otp" type="text" maxlength="6" pattern="\d{6}" placeholder="Enter 6-digit code" />
                    </div>

                    <label class="auth-label" for="new_password">New Password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" id="new_password" name="new_password" type="password" minlength="8" placeholder="Enter new password" />
                    </div>

                    <label class="auth-label" for="confirm_new_password">Confirm New Password</label>
                    <div class="auth-input-wrap">
                        <input class="auth-input" id="confirm_new_password" name="confirm_new_password" type="password" minlength="8" placeholder="Repeat new password" />
                    </div>

                    <button class="auth-btn" type="button" id="verify-reset-btn">Reset Password</button>
                    <button class="auth-alt" type="button" id="back-to-email" style="background:none; border:none; cursor:pointer; padding:0; margin-top:1rem; width:100%; text-align:center;">Back</button>
                </div>
            </form>

            <p class="auth-alt">Remembered your password? <a href="/login">Login</a></p>
        </main>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
</body>

</html>
